name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so newly published CVEs in the locked dependencies show up
    # even when nothing is pushed.
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov upload via OIDC, no token secret
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      # Coverage threshold (fail_under) lives in pyproject.toml
      - name: Run tests with coverage
        run: uv run --locked pytest -v --cov --cov-report=term --cov-report=xml

      # One report is enough for the badge; skipped on fork PRs (no OIDC token)
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          use_oidc: true
          fail_ci_if_error: false

      # Starlette warns when TestClient falls back to the unmaintained httpx
      - name: TestClient uses httpx2
        run: uv run --locked python -W error -c "import fastapi.testclient"

  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Audit locked dependencies
        run: |
          uv export --frozen --all-extras --no-emit-project --format requirements-txt -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --disable-pip

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Build
        run: uv build --no-sources

      - name: Check distribution metadata
        run: uvx twine check --strict dist/*

      - name: Smoke test (wheel)
        run: uv run --isolated --no-project --with dist/*.whl scripts/smoke_test.py

      - name: Smoke test (wheel + jwt extra)
        run: uv run --isolated --no-project --with dist/*.whl --with pyjwt scripts/smoke_test.py

      - name: Smoke test (source distribution)
        run: uv run --isolated --no-project --with dist/*.tar.gz scripts/smoke_test.py